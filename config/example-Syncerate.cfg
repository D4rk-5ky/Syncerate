# Syncerate 0.4.21 example configuration.
# Copy this file, edit the paths and command, then run:
#   ./Syncerate.py --conf /path/to/Syncerate.cfg

[Syncerate Config]

# Optional name and description written to logs and email bodies.
BackupTitle = Main ZFS backup
BackupComment = Replicate selected datasets to the backup pool

# Required source and destination dataset lists.
# Blank lines and lines beginning with # are ignored.
SourceListPath = /path/to/example-source-file
DestListPath = /path/to/example-dest-file

# Required Syncoid command template.
# Keep the exact SourceDataSet and DestDataSet placeholders.
# This example pulls from a remote source to a local destination.
# Local ZFS commands run as the effective user that starts Syncerate.
# Remote ZFS commands run as the SSH user written before @.
# --no-privilege-elevation keeps Syncoid from invoking sudo; it does not
# replace or downgrade the local executing user.
SyncoidCommand = syncoid username@192.0.2.10:SourceDataSet DestDataSet --compress none --sshport 22 --sshkey /root/.ssh/syncerate --no-privilege-elevation

# Password or SSH-key passphrase handling:
#   No   = do not provide a password or passphrase
#   Ask  = prompt securely when Syncerate starts (recommended for encrypted keys)
#   text = use the literal value from this file
# Pexpect-through-Syncoid mode sends this when nested SSH prompts. In agent
# mode it is first used by ssh-add and remains available to the original
# Pexpect-through-Syncoid prompt handling if nested SSH still asks.
PassWord = No

# Optional private ssh-agent for encrypted --sshkey identities:
#   No  = original Pexpect -> Syncoid behavior with no private agent
#   Yes = start one isolated per-run ssh-agent and load the --sshkey identity
#         with direct Pexpect -> ssh-add before Pexpect starts Syncoid.
# SyncoidCommand is not rewritten; Syncoid still controls SSH/mbuffer/ZFS and
# inherits the private agent through SSH_AUTH_SOCK.
# Requires --sshkey in SyncoidCommand plus ssh-agent and ssh-add from OpenSSH.
UseSSHAgent = No

# Maximum lifetime of the loaded agent identity, in seconds. Must be > 0.
# The default is 3600 when omitted. If it expires during a long Syncerate run,
# the key is reloaded before the next dataset. The private agent is still
# destroyed immediately when the run normally finishes or raises an error.
SSHAgentKeyLifetimeSeconds = 3600

# Email recipient for success and error notifications.
# Requires a configured local "mail" command.
# Set to No to disable email.
Mail = No

# strftime format used in log filenames.
DateTime = %Y-%m-%d_%H_%M_%S

# Directory for .log, .err, and .out files.
# Set to No to write only to the terminal.
LogDestination = No

# Optional shell command executed only after a successful run.
# Examples: shutdown -P now, reboot, or /path/to/script.sh
SystemAction = No

# Optional dataset-level Broken Pipe handling:
#   No  = preserve normal Syncoid exit-status handling
#   Yes = retry each affected dataset up to BrokenPipeRetryCount times; if the
#         retry allowance is exhausted, skip only that dataset, continue the
#         list, and finish with a warning-success
# A Broken Pipe emitted while Syncoid is resetting a stale resumable receive is
# treated as part of that recovery and does not consume this retry allowance.
RetryBrokenPipe = No

# Number of retries allowed for each individual dataset after its first Broken
# Pipe. The count resets for the next dataset. Zero skips immediately after the
# first Broken Pipe. The default is 1 when this option is omitted.
BrokenPipeRetryCount = 1

# Whole seconds to wait before each Broken Pipe retry.
# Zero means no wait before a retry. The default is 10 when this option is omitted.
BrokenPipeRetryWaitSeconds = 10

# Legacy MQTT publishing is optional and disabled by default.
# This keeps the original Syncerate behavior unchanged:
#   Use_MQTT = Yes publishes mqtt_message to mqtt_topic after success, retained.
#   Use_HomeAssistant = Yes additionally publishes retained payload "online"
#   to HomeAssistant_Available, just as older Syncerate versions did.
Use_MQTT = No

# Shared broker settings. They are used when either legacy MQTT or JSON status
# publishing is enabled.
broker_address = mqtt.example.com
broker_port = 1883
mqtt_username =
mqtt_password =

# Original retained success-only MQTT output. Used when Use_MQTT = Yes.
mqtt_topic = home-assistant/syncerate/command
mqtt_message = ON

# Original Home Assistant availability integration. This remains tied to the
# legacy Use_MQTT path and does not change JSON behavior.
Use_HomeAssistant = No
HomeAssistant_Available = home-assistant/syncerate/available

# Independent structured success/failure event channel. This may be enabled
# together with the old MQTT/HA outputs, or by itself with Use_MQTT = No.
# JSON always publishes with retain=false. The JSON topic must be dedicated and
# must not equal mqtt_topic or HomeAssistant_Available when those are in use.
# The configured SyncoidCommand is deliberately never included in JSON.
MQTT_JSON_Status = No
mqtt_json_topic = home-assistant/syncerate/json-status
