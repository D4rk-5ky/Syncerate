alias: SnapBeforeWatchTower - MQTT JSON Status
description: >-
  Handle SnapBeforeWatchTower success, failure, or unknown reports from the dedicated
  non-retained MQTT JSON status topic.
triggers:
  - trigger: mqtt
    id: snapbeforewatchtower
    options:
      topic: homeassistant/SnapBeforeWatchTower/Zotac-RI531/status
conditions: []
actions:
  - variables:
      mqtt_status: |-
        {% if trigger.payload_json is defined %}
          {{ trigger.payload_json.status | default('unknown') | string | lower }}
        {% else %}
          unknown
        {% endif %}
      report_title: |-
        {% if trigger.payload_json is defined %}
          {{ trigger.payload_json.title
             | default(trigger.payload_json.name
             | default(trigger.payload_json.job | default('SnapBeforeWatchTower'))) }}
        {% else %}
          SnapBeforeWatchTower
        {% endif %}
      report_exit_code: |-
        {% if trigger.payload_json is defined %}
          {{ trigger.payload_json.exit_code | default('unknown') }}
        {% else %}
          unknown
        {% endif %}
      report_error: |-
        {% if trigger.payload_json is defined %}
          {{ trigger.payload_json.error | default('No error message') }}
        {% else %}
          No valid JSON error message
        {% endif %}
      report_stderr: |-
        {% if trigger.payload_json is defined %}
          {{ trigger.payload_json.stderr | default('No stderr captured') }}
        {% else %}
          No valid JSON stderr captured
        {% endif %}
      report_warning: |-
        {% if trigger.payload_json is defined %}
          {{ trigger.payload_json.warning | default(false) | bool }}
        {% else %}
          false
        {% endif %}
  - choose:
      - conditions:
          - condition: template
            value_template: '{{ mqtt_status == ''success'' }}'
        sequence:
          - action: notify.pushover
            data:
              title: ✅ SnapBeforeWatchTower successful
              message: >-
                {{ report_title }} finished successfully.

                Exit code: {{ report_exit_code }} {% if report_warning | bool %}

                Warning: SnapBeforeWatchTower completed with one or more
                non-fatal warnings. {% endif %}
              data:
                priority: 0
                sound: pushover
      - conditions:
          - condition: template
            value_template: '{{ mqtt_status == ''failure'' }}'
        sequence:
          - action: notify.pushover
            data:
              title: ❌SnapBeforeWatchTower failed
              message: |-
                {{ report_title }} failed.
                Exit code: {{ report_exit_code }}
                Error: {{ report_error }}
                Last stderr/output: {{ report_stderr }}
              data:
                priority: 1
                sound: siren
    default:
      - action: notify.pushover
        data:
          title: ❔ SnapBeforeWatchTower status unknown
          message: >-
            Received an MQTT status that was neither success nor failure.

            Title: {{ report_title }} Topic: {{ trigger.topic }} Raw payload: {{
            trigger.payload | default('No payload') }}
          data:
            priority: 0
            sound: pushover
mode: parallel
max: 10
